name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Links rot without anyone touching the repo. A weekly run is the only way
  # to find out before a parent does.
  schedule:
    - cron: "0 13 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Content is valid
        run: pnpm content:validate

      - name: Every pack is registered
        run: pnpm content:registry:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: No client chunk is oversized
        run: pnpm bundle:check

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/web/coverage
            packages/*/coverage
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # next/font fetches Google Fonts at build time. Without this cache a
      # network hiccup fails the build with "An error occurred in next/font",
      # which is what happened on PR #56.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/**/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Install browsers
        run: pnpm --filter @ninetothree/web exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm --filter @ninetothree/web exec playwright test --project=chromium

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm --filter @ninetothree/web exec playwright install --with-deps chromium

      # Every story is rendered, checked for console errors, checked that the
      # design tokens actually resolve, and run through axe. A story that
      # throws or renders unstyled is a component that will do the same in the
      # product.
      - name: Build Storybook and check every story
        run: pnpm --filter @ninetothree/web exec playwright test --project=storybook

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-report
          path: apps/web/playwright-report
          retention-days: 7

  links:
    name: Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A dead citation is worse than no citation: it tells a parent at 3am
      # that the product is not maintained. Covers both the sources a pack
      # cites and every entry in the link catalogue. 403s from bot-protected
      # hosts are reported for manual review, not failed.
      - name: Check every cited source and catalogue link resolves
        run: pnpm links:check

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # next/font fetches Google Fonts at build time. Without this cache a
      # network hiccup fails the build with "An error occurred in next/font",
      # which is what happened on PR #56.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/**/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            next-${{ runner.os }}-

      - name: Build
        run: pnpm build

      - name: Assert the budget
        run: pnpm lighthouse

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
