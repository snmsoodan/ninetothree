packages:
  - "apps/*"
  - "packages/*"

# One React, or the app crashes on a hook read of null. Expo SDK 58 requires
# React 19.3.0 exactly; several libraries declare a `^19` peer, which pnpm
# otherwise satisfies by installing a second copy beside it.
overrides:
  react: 19.3.0
  react-dom: 19.3.0

allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true

minimumReleaseAgeExclude:
  - '@storybook/addon-a11y@10.6.3'
  - '@storybook/addon-docs@10.6.3'
  - '@storybook/builder-vite@10.6.3'
  - '@storybook/react-dom-shim@10.6.3'
  - '@storybook/react-vite@10.6.3'
  - '@storybook/react@10.6.3'
  - storybook@10.6.3
